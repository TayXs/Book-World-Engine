[project]
name = "truthcast"
version = "0.1.0"
description = "Watches YouTube videos and podcasts, verifies what they claim against real-world evidence, and reads back only the parts that hold up - in plain language a 10-year-old can follow."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "youtube-transcript-api>=1.2",
    "feedparser>=6.0.11",
]

[project.optional-dependencies]
# Needed only for sources with no usable captions (most podcasts).
asr = ["faster-whisper>=1.0.3", "yt-dlp>=2024.8.6"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "playwright>=1.44"]

[project.scripts]
truthcast = "truthcast.cli:main"
truthcast-serve = "truthcast.cli:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["truthcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
